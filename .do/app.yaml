name: chitwise-admin
region: blr
services:
  - name: chitwise-web
    github:
      repo: AppfinityLabs/chitwise-new
      branch: main
      deploy_on_push: true
    build_command: npm run build
    run_command: npm run start
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    http_port: 3000
    envs:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        type: SECRET
      - key: JWT_SECRET
        type: SECRET
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: CLOUDINARY_CLOUD_NAME
        type: SECRET
      - key: CLOUDINARY_API_KEY
        type: SECRET
      - key: CLOUDINARY_API_SECRET
        type: SECRET
      - key: VAPID_PUBLIC_KEY
        type: SECRET
      - key: VAPID_PRIVATE_KEY
        type: SECRET
      - key: VAPID_SUBJECT
        value: "mailto:admin@chitwise.com"
      - key: RAZORPAY_KEY_ID
        type: SECRET
      - key: RAZORPAY_KEY_SECRET
        type: SECRET
      # Razorpay webhook HMAC — required by /api/org-subscription/webhook
      - key: RAZORPAY_WEBHOOK_SECRET
        type: SECRET
      # Cron auth — required by middleware for /api/cron/* routes
      - key: CRON_SECRET
        type: SECRET
      # Firebase Admin SDK — member OTP verify + FCM push
      - key: FIREBASE_PROJECT_ID
        value: "chitwise-appfinity"
      - key: FIREBASE_WEB_API_KEY
        type: SECRET
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        type: SECRET
      # Firebase client (inlined into browser bundle at build time)
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        type: SECRET
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        value: "chitwise-appfinity"
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        value: "chitwise-appfinity.firebaseapp.com"
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        value: "chitwise-appfinity.appspot.com"
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        type: SECRET
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        type: SECRET
      # Email (Resend) — optional; set if email notifications are used
      - key: RESEND_API_KEY
        type: SECRET
      - key: EMAIL_FROM
        value: "noreply@chitwise.com"
      # Seed endpoint disabled in production
      - key: SEED_ENABLED
        value: "false"
      - key: NEXT_PUBLIC_APP_URL
        value: "https://chitwise-admin.ondigitalocean.app"
      - key: NEXT_PUBLIC_PWA_URL
        value: "https://chitwise-pwa.vercel.app"
      - key: NEXT_PUBLIC_MEMBER_PWA_URL
        value: "https://chitwise-member.vercel.app"
